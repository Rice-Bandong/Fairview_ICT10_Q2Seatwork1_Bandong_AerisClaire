]<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glee Club Verification System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

  <style>
  
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(
        45deg,
        #80c2ff 0%,        
        #1acaff 25%,
        #2a5de8 50%,
        #36d2e0 75%,
        #44f2ec 100%
      );
      background-image: url('https://i.pinimg.com/originals/c8/67/69/c867698dffb378a1d428efc332f86b39.gif');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      animation: gradientBG 17s ease-in-out infinite;
      min-height: 100vh;
      color: #000e3d;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      content: "✧ 🫧 𓍢ִ໋ 🎧 ✧ ☁️ 🫧 ♩ ✧ 𓍢ִ໋ 🎶 𓍢ִ໋";
      position: absolute;
      top: 5%;
      left: 5%;
      right: 5%;
      bottom: 5%;
      opacity: 0.35;
      font-size: 28px;
      color: #ffffff;
      word-spacing: 45px;
      line-height: 85px;
      pointer-events: none;
      text-shadow: 0 0 10px #ffffff, 0 0 18px #1acaff;
      z-index: 1;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      width: 100%;
      max-width: 580px;
      text-align: center;
      margin-top: 10px;
      z-index: 10;
    }

    .header-badge {
      display: inline-block;
      background: rgba(230, 244, 255, 0.65);
      color: #0a2540;
      padding: 10px 26px;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 700;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 8px 25px rgba(26, 202, 255, 0.35);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
    }

    .light-box {
      margin: 25px auto;
      padding: 35px 30px;
      width: 100%;
      max-width: 460px;
      background: rgba(220, 242, 255, 0.55);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);  
      border-radius: 35px;
      border: 3px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 45px rgba(26, 202, 255, 0.35), inset 0 0 25px rgba(255, 255, 255, 0.8);  
      animation: whimsyFloat 3.5s ease-in-out infinite;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    @keyframes whimsyFloat {
      0%, 100% {
        transform: translateY(0px);
        box-shadow: 0 15px 35px rgba(26, 202, 255, 0.35), 0 0 25px rgba(68, 242, 236, 0.45);
      }
      50% {
        transform: translateY(-9px);
        box-shadow: 0 25px 50px rgba(42, 93, 232, 0.45), 0 0 35px rgba(68, 242, 236, 0.65);
      }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
      display: inline-block;
      background: linear-gradient(135deg, #1acaff, #2a5de8, #36d2e0);
      padding: 10px 24px;
      border-radius: 22px;
      box-shadow: 0 4px 15px rgba(26, 202, 255, 0.45);
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.25);
    }

    .subtitle {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: #003270;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      font-weight: 700;
      font-size: 0.9rem;
      color: #00224d;
      margin-bottom: 6px;
      display: block;
    }

    input {
      width: 100%;
      padding: 11px 16px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      font-family: inherit;
      font-weight: 700;
      color: #001f40;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      background: #ffffff;
      border-color: #1acaff;
      box-shadow: 0 0 14px rgba(26, 202, 255, 0.8), 0 0 10px rgba(68, 242, 236, 0.5);
    }

    .btn-fairy {
      width: 100%;
      margin-top: 18px;
      background: linear-gradient(135deg, #36d2e0 0%, #1acaff 40%, #2a5de8 100%);
      color: #ffffff;
      padding: 13px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 5px 18px rgba(26, 202, 255, 0.5);
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.25);
      letter-spacing: 1px;
    }

    .btn-fairy:hover {
      transform: scale(1.03);
      background: linear-gradient(135deg, #2a5de8 0%, #1acaff 60%, #36d2e0 100%);
      box-shadow: 0 0 22px rgba(26, 202, 255, 0.85);
    }

    #result_area {
      margin-top: 22px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      font-weight: 700;
      color: #002b5b;
      border: 2px solid #36d2e0;
      box-shadow: 0 4px 15px rgba(54, 210, 224, 0.35);
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    footer {
      width: 100%;
      max-width: 500px;
      padding: 14px;
      text-align: center;
      background: rgba(230, 244, 255, 0.6);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 22px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 20px rgba(26, 202, 255, 0.25);
      z-index: 10;
      margin-top: 10px;
    }

    footer p {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 700;
      color: #002347;
    }

    .footer-sub {
      font-size: 0.75rem;
      opacity: 0.85;
      margin-top: 3px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-badge">
      ༺🫧Glee Club 🎶༻
    </div>
  </header>

  <div class="light-box">
    <h1>✨ GLEE CLUB CHECKER 🎤</h1>
    <p class="subtitle mb-4">Candidate Verification System</p>

    <div class="form-group">
      <label for="first_name">First Name:</label>
      <input type="text" id="first_name" placeholder="e.g. Tecna">
    </div>

    <div class="form-group">
      <label for="last_name">Last Name:</label>
      <input type="text" id="last_name" placeholder="e.g. of Zenith">
    </div>

    <button id="check_btn" class="btn-fairy" py-click="check_candidate">✧ ENTER AUDITION ✧</button>

    <div id="result_area">
      <span style="opacity: 0.8; font-weight: 600;">Enter candidate name to verify membership status.</span>
    </div>
  </div>

  <footer>
    <p>Aeris Claire D. Bandong | Q2 Seatwork 1</p>
    <p class="footer-sub">Grade 10 SAPPHIRE | Glee Club Verification System</p>
  </footer>

  <script type="py" src="main.py"></script>

</body>
</html>
