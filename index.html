<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Verification System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #1a050b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        .card-custom {
            background-color: #0d0d0d;
            border: 2px solid #a81c48;
            border-radius: 10px;
        }
        .btn-custom {
            background-color: #b01040;
            color: #ffffff;
            border: 1px solid #ff4070;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #d01550;
            color: #ffffff;
        }
        .result-box {
            background-color: #111a15;
            border: 1px solid #10b981;
            color: #86efac;
            border-radius: 8px;
            font-size: 1.1rem;
        }
        .header-title {
            color: #facc15;
            letter-spacing: 2px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container text-center" style="max-width: 450px;">

        <h2 class="header-title fw-bold mb-1">ICT CLUB CHECKER</h2>
        <p class="text-secondary small text-uppercase mb-4">Candidate Verification System</p>

        <div class="card card-custom p-4 mb-4">
            <div class="mb-3">
                <input type="text" id="first_name" class="form-control bg-dark text-white border-secondary text-center" placeholder="First Name">
            </div>
            <div class="mb-4">
                <input type="text" id="last_name" class="form-control bg-dark text-white border-secondary text-center" placeholder="Last Name">
            </div>
            <button id="check_btn" class="btn btn-custom w-100 py-2" py-click="check_candidate">ENTER</button>
        </div>

        <div id="result_area" class="result-box p-3 fw-semibold">
            Enter candidate name to check status.
        </div>

        <footer class="mt-5 text-secondary small">
            &copy; 2026 ICT Club | Seatwork 1 | 2nd Quarter
        </footer>
    </div>

    <script type="py" src="./main.py" config='{"packages": []}'></script>

</body>
</html>
